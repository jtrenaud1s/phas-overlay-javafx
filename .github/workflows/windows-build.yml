name: Windows Build (with VS2022 Build Tools + Cache)

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 1) Attempt to restore the Chocolatey packages from cache
      - name: Cache Chocolatey Packages
        uses: actions/cache@v3
        with:
          path: |
            C:\ProgramData\chocolatey\lib
            C:\ProgramData\chocolatey\bin
            C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools
            C:\Program Files (x86)\Windows Kits\10
          key: choco-${{ runner.os }}-${{ hashFiles('pom.xml', 'setup.iss') }}
          restore-keys: |
            choco-${{ runner.os }}-

      # 2) Install VS Build Tools & Inno Setup (if not already cached)
      - name: Install Visual Studio 2022 Build Tools & Inno Setup
        run: |
          if not exist "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools" (
            choco install visualstudio2022buildtools --yes --package-parameters
          )
          if not exist "C:\Program Files (x86)\Windows Kits\10" (
            choco install windows-sdk-10.0 --package-parameters "--quiet --wait"
          )
          choco install innosetup --yes

      # 3) Run the Developer Command Prompt setup + Maven in the same step
      # so the environment variables carry through.
      - name: Build with Maven (Developer Command Prompt)
        # Must use Windows 'cmd' shell so "call" works
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x86_x64
          mvn clean package

      # 4) Run Inno Setup
      - name: Run Inno Setup
        shell: cmd
        run: |
          call "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Auxiliary\Build\vcvarsall.bat" x86_x64
          ISCC.exe setup.iss

      # 5) Upload artifacts: jars, exes, msis, etc.
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Distributables
          path: |
            target\*.jar
            **\*.exe
            **\*.msi