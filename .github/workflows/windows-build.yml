name: Windows Build (with Visual Studio 2022 Build Tools)

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Java 17
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Install Visual Studio 2022 Build Tools & Inno Setup
        run: |
          choco install visualstudio2022buildtools --yes --package-parameters `
            "--add Microsoft.VisualStudio.Component.VC.CoreBuildTools `
             --add Microsoft.VisualStudio.Component.Windows10SDK.20348 `
             --add Microsoft.VisualStudio.Component.VC.Llvm.Clang `
             --includeRecommended --includeOptional"
          choco install innosetup --yes

      - name: Build with Maven
        run: mvn clean package

      - name: Run Inno Setup
        run: ISCC.exe setup.iss

      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Distributables
          path: |
            target\*.jar
            **\*.exe
            **\*.msi