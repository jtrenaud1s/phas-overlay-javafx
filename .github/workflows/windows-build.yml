name: Windows Build (with VS2022 Build Tools + Cache)

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 1) Attempt to restore the Chocolatey packages from cache
      - name: Cache Chocolatey Packages
        uses: actions/cache@v3
        with:
          path: |
            C:\ProgramData\chocolatey\lib
            C:\ProgramData\chocolatey\bin
            C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools
            C:\Program Files (x86)\Windows Kits\10
          key: choco-${{ runner.os }}-${{ hashFiles('pom.xml', 'setup.iss') }}
          restore-keys: |
            choco-${{ runner.os }}-

      # 2) Install VS Build Tools & Inno Setup (if not already cached)
      - name: Install Visual Studio 2022 Build Tools & Inno Setup
        run: |
          if (!(Test-Path "C:\Program Files (x86)\Windows Kits\10")) {
              choco install windows-sdk-10.0 --package-parameters "--quiet --wait"
          }
          if (!(Test-Path "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools")) {
              choco install visualstudio2022buildtools --yes --package-parameters "--includeRecommended --includeOptional --quiet --wait"
          }

      # 3) Print the PATH environment variable
      - name: Print PATH
        shell: cmd
        run: echo %PATH%

      - name: Show directory tree for Visual Studio Build Tools
        shell: cmd
        run: tree "C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools" /F /A

      - name: Show directory tree for Windows Kits
        shell: cmd
        run: tree "C:\Program Files (x86)\Windows Kits\10" /F /A

      - name: Add SDK to PATH
        shell: cmd
        run: |
          set PATH=%PATH%;C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\VC\Tools\MSVC\14.29.30133\bin\Hostx64\x64;C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64;C:\Program Files (x86)\Windows Kits\10\bin\10.0.19041.0\x64
          echo %PATH%

      # 4) Run the Developer Command Prompt setup + Maven in the same step
      # so the environment variables carry through.
      - name: Build with Maven (Developer Command Prompt)
        # Must use Windows 'cmd' shell so "call" works
        shell: cmd
        run: |
          echo %PATH%
          mvn clean package

      # 5) Run Inno Setup
      - name: Run Inno Setup
        shell: cmd
        run: |
          ISCC.exe setup.iss

      # 6) Upload artifacts: jars, exes, msis, etc.
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Distributables
          path: |
            target\*.jar
            **\*.exe
            **\*.msi