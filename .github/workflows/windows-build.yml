name: Windows Build (with VS2022 Build Tools + Cache)

on:
  push:
    branches: [ "develop" ]

jobs:
  build-and-package:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v3


      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      # 2) Install VS Build Tools
      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      # 3) Print the PATH environment variable
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Print PATH
        shell: cmd
        run: echo %PATH%

      # 4) Run the Developer Command Prompt setup + Maven in the same step
      # so the environment variables carry through.
      - name: Build with Maven
        # Must use Windows 'cmd' shell so "call" works
        run: mvn clean install

      # 5) Run Inno Setup
      - name: Run Inno Setup
        shell: cmd
        run: |
          ISCC.exe setup.iss

      # 6) Upload artifacts: jars, exes, msis, etc.
      - name: Upload artifacts
        uses: actions/upload-artifact@v3
        with:
          name: Distributables
          path: |
            target\*.jar
            **\*.exe
            **\*.msi