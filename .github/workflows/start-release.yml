name: "Start Release"

on:
  workflow_dispatch:
    inputs:
      release_type:
        description: "Select release type (major, minor, patch)."
        required: true
        type: choice
        options:
          - major
          - minor
          - patch

jobs:
  start-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out develop branch
        uses: actions/checkout@v3
        with:
          ref: develop  # ensure we start from 'develop'

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Determine Next Release Version
        id: version
        run: |
          echo "Reading current version from pom.xml..."
          CURRENT_VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "CURRENT_VERSION=$CURRENT_VERSION"

          # Remove '-SNAPSHOT' if present
          BASE_VERSION=${CURRENT_VERSION/-SNAPSHOT/}

          MAJOR=$(echo "$BASE_VERSION" | cut -d. -f1)
          MINOR=$(echo "$BASE_VERSION" | cut -d. -f2)
          PATCH=$(echo "$BASE_VERSION" | cut -d. -f3)

          case "${{ github.event.inputs.release_type }}" in
            major)
              MAJOR=$((MAJOR+1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR+1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH+1))
              ;;
          esac

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "NEW_VERSION=$NEW_VERSION"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT

      - name: Create release branch
        id: create_branch
        run: |
          RELEASE_BRANCH="release/${{ steps.version.outputs.new_version }}"
          echo "RELEASE_BRANCH=$RELEASE_BRANCH" >> $GITHUB_OUTPUT
          git checkout -b "$RELEASE_BRANCH"

      - name: Bump Maven Version on release branch
        run: |
          mvn versions:set -DnewVersion=${{ steps.version.outputs.new_version }}-SNAPSHOT -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: start release ${{ steps.version.outputs.new_version }}-SNAPSHOT"

      - name: Push release branch
        run: |
          RELEASE_BRANCH="release/${{ steps.version.outputs.new_version }}"
          git push origin "$RELEASE_BRANCH"