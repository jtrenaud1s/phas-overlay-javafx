name: "Close Release"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Which release branch are we closing? e.g. release/1.2.0"
        required: true
        type: string

jobs:
  close-release:
    runs-on: windows-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.release_branch }}

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Get Current Version
        id: get-version
        run: |
          $env:CURRENT_VERSION = (mvn help:evaluate -Dexpression="project.version" -q -DforceStdout)
          echo "CURRENT_VERSION: $env:CURRENT_VERSION"
          $env:BASE_VERSION = $env:CURRENT_VERSION -replace '-SNAPSHOT', ''
          echo "FINAL_VERSION: $env:BASE_VERSION"
          echo "final_version=$env:BASE_VERSION" >> "$env:GITHUB_OUTPUT"
        shell: pwsh

      - name: Finalize Release Version
        id: version
        run: |
          echo "${{ steps.get-version.outputs.final_version }}"
          mvn versions:set -DnewVersion="${{ steps.get-version.outputs.final_version }}" -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: finalize release version ${{ steps.get-version.outputs.final_version }}"
          git push origin HEAD
        shell: pwsh

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Setup MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build & Create Installer
        shell: pwsh
        run: |
          mvn clean install -DmoduleVersion="${{ steps.get-version.outputs.final_version }}"
          ISCC.exe ".\target\classes\setup.iss"

      - name: Tag the commit
        run: |
          git fetch --all
          git tag "v${{ steps.get-version.outputs.final_version }}"
          git push origin "v${{ steps.get-version.outputs.final_version }}"

      - name: Merge release into main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff ${{ github.event.inputs.release_branch }} -m "chore: Merge release ${{ steps.get-version.outputs.final_version }} into main"
          git push origin main

      - name: Merge release into develop
        run: |
          git checkout develop
          git pull origin develop
          git merge --no-ff ${{ github.event.inputs.release_branch }} -m "chore: Merge release ${{ steps.get-version.outputs.final_version }} into develop"
          git push origin develop

      - name: Get next snapshot version
        id: get-snapshot-version
        run: |
          # Read final release version from step
          $env:FINAL_VERSION = "${{ steps.get-version.outputs.final_version }}"

          # Parse it e.g. 1.2.0
          $env:parts = $env:FINAL_VERSION -split '\.'
          $env:MAJOR = $env:parts[0]
          $env:MINOR = if ($env:parts.Length -gt 1) { $env:parts[1] } else { 0 }
          $env:PATCH = if ($env:parts.Length -gt 2) { $env:parts[2] } else { 0 }
          Write-Host "MAJOR: $env:MAJOR"
          Write-Host "MINOR: $env:MINOR"
          Write-Host "PATCH: $env:PATCH"

          # Typically we bump the MINOR for the next dev cycle
          # so if final release was 1.2.0, next dev is 1.3.0-SNAPSHOT
          $env:MINOR = [int]$env:MINOR + 1
          $env:NEXT_DEV_VERSION = "$env:MAJOR.$MINOR.0-SNAPSHOT"
          Write-Host "NEXT_DEV_VERSION: $env:NEXT_DEV_VERSION"
          echo "next_dev_version=$env:NEXT_DEV_VERSION" >> "$env:GITHUB_OUTPUT"
        shell: pwsh

      - name: Bump Maven Version on develop branch
        run: |
          mvn versions:set -DnewVersion="${{ steps.get-snapshot-version.outputs.next_dev_version }}" -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: bump develop version to ${{ steps.get-snapshot-version.outputs.next_dev_version }}"
          git push origin HEAD
        shell: pwsh

      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: PhasOverlay-Installer
          path: target\PhasOverlay-${{ steps.version.outputs.final_version }}-installer.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v3
        with:
          name: PhasOverlay-MSI
          path: target/*.msi

      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.version.outputs.final_version }}
          release_name: "v${{ steps.version.outputs.final_version }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Installer to Release
        if: ${{ success() }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target\PhasOverlay-${{ steps.version.outputs.final_version }}-installer.exe
          asset_name: PhasOverlay-${{ steps.version.outputs.final_version }}-installer.exe
          asset_content_type: application/octet-stream
          body: |
            ${{ steps.Changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}