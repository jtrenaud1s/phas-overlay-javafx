name: "Close Release"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Which release branch are we closing? e.g. release/1.2.0"
        required: true
        type: string

jobs:
  close-release:
    runs-on: windows-latest
    steps:
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Get Current Version
        id: get-version
        run: |
          $env:CURRENT_VERSION = (mvn help:evaluate -Dexpression="project.version" -q -DforceStdout)
          echo "CURRENT_VERSION: $env:CURRENT_VERSION"
          $env:BASE_VERSION = $env:CURRENT_VERSION -replace '-SNAPSHOT', ''
          echo "BASE_VERSION: $env:BASE_VERSION"
          echo "FINAL_VERSION=$env:BASE_VERSION"
          echo "final_version=$env:BASE_VERSION" >> "$env:GITHUB_OUTPUT"
        shell: pwsh
