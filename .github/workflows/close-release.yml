name: "Close Release"

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      release_branch:
        description: "Which release branch are we closing? e.g. release/1.2.0"
        required: true
        type: string

jobs:
  close-release:
    runs-on: windows-latest
    steps:
      - name: Check out release branch
        uses: actions/checkout@v3
        with:
          ref: ${{ github.event.inputs.release_branch }}

      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Clang
        uses: egor-tensin/setup-clang@v1
        with:
          version: latest
          platform: x64

      - name: Setup MSVC Dev Cmd
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git"

      - name: Finalize Release Version
        id: version
        run: |
          $CURRENT_VERSION = (mvn help:evaluate -Dexpression="project.version" -q -DforceStdout)
          $BASE_VERSION = $CURRENT_VERSION -replace '-SNAPSHOT', ''
          echo "FINAL_VERSION=$BASE_VERSION"
          echo "final_version=$BASE_VERSION" >> $env:GITHUB_OUTPUT
          mvn versions:set -DnewVersion=$BASE_VERSION -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: finalize release version $BASE_VERSION"
          git push origin HEAD
        shell: pwsh

      - name: Build & Create Installer
        shell: cmd
        run: |
          mvn clean install
          ISCC.exe target\classes\setup.iss

      - name: Tag the commit
        run: |
          git fetch --all
          git tag "v${{ steps.version.outputs.final_version }}"
          git push origin "v${{ steps.version.outputs.final_version }}"

      - name: Changelog
        uses: Bullrich/generate-release-changelog@master
        id: Changelog
        env:
          REPO: ${{ github.repository }}

      - name: Merge release into main
        run: |
          git checkout main
          git pull origin main
          git merge --no-ff ${{ github.event.inputs.release_branch }} -m "chore: Merge release ${{ steps.version.outputs.final_version }} into main"
          git push origin master

      - name: Merge release into develop
        run: |
          git checkout develop
          git pull origin develop
          git merge --no-ff ${{ github.event.inputs.release_branch }} -m "chore: Merge release ${{ steps.version.outputs.final_version }} into develop"
          git push origin develop

      - name: Bump develop to next minor snapshot
        run: |
          # Read final release version from step
          $FINAL_VERSION = "${{ steps.version.outputs.final_version }}"

          # Parse it e.g. 1.2.0
          $parts = $FINAL_VERSION -split '\.'
          $MAJOR = $parts[0]
          $MINOR = $parts[1]
          $PATCH = $parts[2]

          # Typically we bump the MINOR for the next dev cycle
          # so if final release was 1.2.0, next dev is 1.3.0-SNAPSHOT
          $MINOR = [int]$MINOR + 1
          $NEXT_DEV_VERSION = "$MAJOR.$MINOR.0-SNAPSHOT"

          Write-Host "Bumping develop to $NEXT_DEV_VERSION"

          # We are currently on 'develop' branch from the merge step above
          mvn versions:set -DnewVersion=$NEXT_DEV_VERSION -DgenerateBackupPoms=false
          git add pom.xml
          git commit -m "chore: Bump develop to $NEXT_DEV_VERSION for new dev cycle"
          git push origin develop
        shell: pwsh

      # 7) Upload artifacts for reference
      - name: Upload EXE
        uses: actions/upload-artifact@v3
        with:
          name: PhasOverlay-Installer
          path: target\PhasOverlay-${{ steps.version.outputs.final_version }}-installer.exe

      - name: Upload MSI
        uses: actions/upload-artifact@v3
        with:
          name: PhasOverlay-MSI
          path: target/*.msi

      # 8) Create GitHub Release
      - name: Create GitHub Release
        id: create_release
        uses: actions/create-release@v1
        with:
          tag_name: v${{ steps.version.outputs.final_version }}
          release_name: "v${{ steps.version.outputs.final_version }}"
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # 9) Upload Installer to Release
      - name: Upload Installer to Release
        if: ${{ success() }}
        uses: actions/upload-release-asset@v1
        with:
          upload_url: ${{ steps.create_release.outputs.upload_url }}
          asset_path: target\PhasOverlay-${{ steps.version.outputs.final_version }}-installer.exe
          asset_name: PhasOverlay-${{ steps.version.outputs.final_version }}-installer.exe
          asset_content_type: application/octet-stream
          body: |
            ${{ steps.Changelog.outputs.changelog }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}